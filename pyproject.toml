[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobokit"
version = "0.1.0"
description = "Take a folder of downloaded books to a clean, validated Kobo library"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["kobo", "epub", "ebook", "kepub", "epubcheck"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: XML",
  "Environment :: Console",
]

# Deliberately no runtime dependencies on the core path. This runs on a laptop,
# sometimes inside a locked-down VM, and `pip install kobokit` pulling in
# nothing at all is worth more than the convenience of a vendor SDK. The model
# clients are plain urllib.
dependencies = [
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
# lxml drives the EPUB3 rewriter; epubcheck is the real validator.
full = ["lxml>=4.9", "epubcheck>=5.0", "pillow>=10.0"]
# numpy is not optional within this extra: the fixed-layout path crops every
# page, and the cropper works on arrays.
pdf  = ["pymupdf>=1.23", "pillow>=10.0", "numpy>=1.24"]
mobi = ["mobi>=0.3"]
dev  = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
kobokit = "kobokit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kobokit = ["tools/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
# src/kobokit/tools holds the scripts this was built out of. They are proven
# against a real 373-book library and are carried over unchanged on purpose:
# reformatting them buys style and risks a regression in an EPUB rewriter that
# is hard to test and expensive to get wrong.
extend-exclude = ["src/kobokit/tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long lines are left to judgement.
# UP031: percent formatting is used consistently throughout; it reads better
# in the log and note strings that make up most of it.
ignore = ["E501", "UP031"]
